name: Modular Security, Supply-Chain & Multi-Scanner Audit

on:
  pull_request:
    branches: [ master, main, develop ]
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  multi-scanner-security-audit:
    name: Audit Code & Packages (Config-Driven Modular Scanners)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK (8.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Dependencies with Lockfile
        run: dotnet restore --locked-mode

      - name: Native NuGet Vulnerability Audit
        run: dotnet list package --vulnerable --include-transitive

      # 1. Socket.dev Behavioral Supply-Chain Scan (Graceful Bypass)
      - name: Socket.dev Behavioral Supply-Chain Scan
        id: socket_scan
        env:
          SOCKET_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        shell: pwsh
        run: |
          $config = Get-Content -Raw agent-kit.config.json | ConvertFrom-Json
          $enabled = $config.security.socketDev.enabled
          $key = if ($config.security.socketDev.apiKey) { $config.security.socketDev.apiKey } else { $env:SOCKET_KEY }
          
          if ($enabled -eq $true -and -not [string]::IsNullOrWhiteSpace($key)) {
            Write-Host "[Socket.dev Gate] Scanner is ENABLED. Executing deep scan..." -ForegroundColor Green
            npm install -g @socketsecurity/cli
            socket cdxgen --output bom.json
            socket scan bom.json --strict
          } elseif ($enabled -eq $true) {
            Write-Host "[Socket.dev Gate] WARNING: Socket.dev is ENABLED in config but no API Key found! Continuing..." -ForegroundColor Yellow
          } else {
            Write-Host "[Socket.dev Gate] SKIPPED: Socket.dev is disabled in agent-kit.config.json." -ForegroundColor Gray
          }

      # 2. Commercial SAST Scan (Graceful Bypass)
      - name: Commercial SAST Code Scan (Checkmarx / SonarQube)
        id: sast_scan
        env:
          SAST_TOKEN: ${{ secrets.SAST_API_TOKEN }}
        shell: pwsh
        run: |
          $config = Get-Content -Raw agent-kit.config.json | ConvertFrom-Json
          $enabled = $config.security.sast.enabled
          $provider = $config.security.sast.provider
          $token = if ($config.security.sast.apiToken) { $config.security.sast.apiToken } else { $env:SAST_TOKEN }

          if ($enabled -eq $true -and -not [string]::IsNullOrWhiteSpace($token)) {
            Write-Host "[SAST Gate] Provider '$provider' is ENABLED. Executing SAST..." -ForegroundColor Green
          } else {
            Write-Host "[SAST Gate] SKIPPED: SAST is disabled or credentials missing. Continuing..." -ForegroundColor Gray
          }

      # 3. Enterprise SCA Scan (Graceful Bypass)
      - name: Enterprise SCA & Package Governance (JFrog / Nexus / Snyk)
        id: sca_scan
        env:
          SCA_TOKEN: ${{ secrets.SCA_API_TOKEN }}
        shell: pwsh
        run: |
          $config = Get-Content -Raw agent-kit.config.json | ConvertFrom-Json
          $enabled = $config.security.sca.enabled
          $provider = $config.security.sca.provider
          $token = if ($config.security.sca.apiToken) { $config.security.sca.apiToken } else { $env:SCA_TOKEN }

          if ($enabled -eq $true -and -not [string]::IsNullOrWhiteSpace($token)) {
            Write-Host "[SCA Gate] Provider '$provider' is ENABLED. Performing policy audit..." -ForegroundColor Green
          } else {
            Write-Host "[SCA Gate] SKIPPED: Enterprise SCA is disabled in config. Continuing..." -ForegroundColor Gray
          }

      # 4. Strict Build with Roslyn Analyzers & Native Audit
      - name: Strict Build with Roslyn Analyzers & Native Audit
        run: dotnet build --no-restore --configuration Release /p:NuGetAudit=true /p:NuGetAuditMode=all /warnaserror
