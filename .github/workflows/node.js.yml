# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different operating systems
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js Cross-Platform CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    # 💡 הגדרת מטריצה להרצה מקבילית על חלונות ולינוקס
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      # במידה ואחת ממערכות ההפעלה נכשלת, אל תעצור את המערכת השנייה
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'server/ClientApp/package-lock.json'
        
    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: ./server/ClientApp
      # 💡 כפיית התקנת חבילות הנייטיב הנדרשות עבור Rolldown/Vite 8 בלינוקס
      run: npm ci --include=optional
      
    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ./server/ClientApp
      run: npm ci

    - name: Build the source code
      working-directory: ./server/ClientApp
      run: npm run build --if-present
