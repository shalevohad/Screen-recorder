name: .NET Release & CD

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'גרסה מותאמת אישית (לדוגמה: 2.1.4)'
        required: false
        default: ''
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag: ${{ steps.get_version.outputs.TAG }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine Release Version (SemVer 3-parts)
      id: get_version
      run: |
        CUSTOM_VER="${{ github.event.inputs.custom_version }}"
        REF_NAME="${{ github.ref_name }}"
        REF_TYPE="${{ github.ref_type }}"

        if [ -n "$CUSTOM_VER" ]; then
            VERSION="${CUSTOM_VER#v}"
            TAG="v$VERSION"
        elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            VERSION="${REF_NAME#v}"
        else
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)

            if [ -z "$LATEST_TAG" ]; then
                VERSION="1.0.1"
            else
                RAW_VERSION="${LATEST_TAG#v}"
                IFS='.' read -r major minor patch <<< "$RAW_VERSION"
                patch=$((patch + 1))
                VERSION="$major.$minor.$patch"
            fi
            TAG="v$VERSION"
        fi

        echo "Calculated Version: $VERSION"
        echo "Calculated Tag: $TAG"

        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=$TAG" >> $GITHUB_OUTPUT

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK (8.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js (for Feature Client widgets)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Shutdown .NET Build Server
      run: dotnet build-server shutdown

    - name: Download FFmpeg, FFprobe & MediaMTX for Windows (With Retry)
      shell: pwsh
      run: |
        $ffmpegDestDirs = @(
            "Tools/Win",
            "ITB-SCREEN-RECORDER.AgentWorker",
            "ITB-SCREEN-RECORDER.AgentWorker/Tools/Win",
            "ITB-SCREEN-RECORDER.Server/Tools/Win",
            "Features/Extractor/ITB-SCREEN-RECORDER.Features.Extractor/Tools/Win",
            "Features/ExtractorAdvanced/ITB-SCREEN-RECORDER.Features.ExtractorAdvanced/Tools/Win",
            "Features/Extractor/Tools/Win",
            "Features/ExtractorAdvanced/Tools/Win"
        )
        foreach ($dir in $ffmpegDestDirs) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
        }

        $serverMtxDir = "ITB-SCREEN-RECORDER.Server/MediaMTX"
        New-Item -ItemType Directory -Force -Path $serverMtxDir | Out-Null
        
        # 1. הורדת FFmpeg & FFprobe
        $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
        $zipPath = "ffmpeg.zip"
        
        $maxAttempts = 5
        $attempt = 0
        $success = $false

        while ($attempt -lt $maxAttempts -and -not $success) {
            $attempt++
            try {
                Invoke-WebRequest -Uri $url -OutFile $zipPath -ErrorAction Stop
                $success = $true
            } catch {
                if ($attempt -lt $maxAttempts) { Start-Sleep -Seconds 10 }
            }
        }
        if (-not $success) { throw "Failed to download FFmpeg." }

        Expand-Archive -Path $zipPath -DestinationPath "ffmpeg_extracted" -Force
        $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        $ffprobeExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1

        if (-not $ffmpegExe -or -not $ffprobeExe) {
            throw "FFmpeg or FFprobe executable not found in extracted archive."
        }

        foreach ($dir in $ffmpegDestDirs) {
            Copy-Item $ffmpegExe.FullName -Destination "$dir\ffmpeg.exe" -Force
            Copy-Item $ffprobeExe.FullName -Destination "$dir\ffprobe.exe" -Force
            Write-Host "Copied FFmpeg and FFprobe to $dir"
        }

        # 2. הורדת MediaMTX עבור Windows
        Write-Host "Downloading MediaMTX for Windows..."
        $mediamtxUrl = "https://github.com/bluenviron/mediamtx/releases/download/v1.3.0/mediamtx_v1.3.0_windows_amd64.zip"
        $mediamtxZip = "mediamtx_win.zip"
        Invoke-WebRequest -Uri $mediamtxUrl -OutFile $mediamtxZip
        Expand-Archive -Path $mediamtxZip -DestinationPath "mediamtx_win_extracted" -Force
        $mtxExe = Get-ChildItem -Path "mediamtx_win_extracted" -Recurse -Filter "mediamtx.exe" | Select-Object -First 1
        Copy-Item $mtxExe.FullName -Destination "Tools/Win\mediamtx.exe" -Force
        Copy-Item $mtxExe.FullName -Destination "$serverMtxDir\mediamtx.exe" -Force
        Copy-Item $mtxExe.FullName -Destination "ITB-SCREEN-RECORDER.Server/Tools/Win\mediamtx.exe" -Force

    - name: Install Feature Node Dependencies
      shell: pwsh
      run: |
        Get-ChildItem -Path "Features" -Filter "package.json" -Recurse | Where-Object { $_.FullName -notmatch "node_modules" } | ForEach-Object {
            Write-Host "Installing dependencies for $($_.DirectoryName)..."
            Push-Location $_.DirectoryName
            npm ci --prefer-offline --no-audit || npm install
            Pop-Location
        }

    - name: Restore NuGet dependencies
      run: |
        dotnet restore ITB-Screen-Recorder.sln
        dotnet restore Installers/Windows/ITB-SCREEN-RECORDER.Server.Installer/ITB-SCREEN-RECORDER.Server.Installer.wixproj
        dotnet restore Installers/Windows/ITB-SCREEN-RECORDER.Installer/ITB-SCREEN-RECORDER.Installer.wixproj

    - name: Run Central Unit Tests (Quality Gate)
      timeout-minutes: 2
      run: |
        dotnet build ITB-SCREEN-RECORDER.Tests/ITB-SCREEN-RECORDER.Tests.csproj --no-restore --configuration Release -p:Version=${{ needs.version.outputs.version }}
        dotnet test ITB-SCREEN-RECORDER.Tests/ITB-SCREEN-RECORDER.Tests.csproj --no-build --configuration Release --verbosity minimal

    - name: Build Windows Installers (MSI)
      run: |
        dotnet build ITB-SCREEN-RECORDER.Core/ITB-SCREEN-RECORDER.Core.csproj --no-restore --configuration Release -p:Version=${{ needs.version.outputs.version }}
        dotnet build ITB-SCREEN-RECORDER.AgentWorker/ITB-SCREEN-RECORDER.AgentWorker.csproj --no-restore --configuration Release -p:Version=${{ needs.version.outputs.version }}
        dotnet build ITB-SCREEN-RECORDER.AgentService/ITB-SCREEN-RECORDER.AgentService.csproj --no-restore --configuration Release -p:Version=${{ needs.version.outputs.version }}
        dotnet build ITB-SCREEN-RECORDER.Server/ITB-SCREEN-RECORDER.Server.csproj --no-restore --configuration Release -p:Version=${{ needs.version.outputs.version }}
        dotnet build Installers/Windows/ITB-SCREEN-RECORDER.Server.Installer/ITB-SCREEN-RECORDER.Server.Installer.wixproj --configuration Release -p:Version=${{ needs.version.outputs.version }}
        dotnet build Installers/Windows/ITB-SCREEN-RECORDER.Installer/ITB-SCREEN-RECORDER.Installer.wixproj --configuration Release -p:Version=${{ needs.version.outputs.version }}

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-msi-artifacts
        path: |
          Installers/Windows/ITB-SCREEN-RECORDER.Installer/bin/x64/Release/*.msi
          Installers/Windows/ITB-SCREEN-RECORDER.Server.Installer/bin/x64/Release/*.msi

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK (8.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js (for Feature Client widgets)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Ensure Shell Scripts Execution Permissions
      run: |
        find Installers/Linux -type f -name "*.sh" -exec chmod +x {} +

    - name: Download FFmpeg, FFprobe & MediaMTX for Linux
      run: |
        TARGET_LINUX_DIRS=(
          "Tools/Linux"
          "ITB-SCREEN-RECORDER.AgentWorker"
          "ITB-SCREEN-RECORDER.AgentWorker/Tools/Linux"
          "ITB-SCREEN-RECORDER.Server/Tools/Linux"
          "Features/Extractor/ITB-SCREEN-RECORDER.Features.Extractor/Tools/Linux"
          "Features/ExtractorAdvanced/ITB-SCREEN-RECORDER.Features.ExtractorAdvanced/Tools/Linux"
          "Features/Extractor/Tools/Linux"
          "Features/ExtractorAdvanced/Tools/Linux"
        )
        for dir in "${TARGET_LINUX_DIRS[@]}"; do
          mkdir -p "$dir"
        done

        SERVER_MTX_DIR="ITB-SCREEN-RECORDER.Server/MediaMTX"
        mkdir -p "$SERVER_MTX_DIR"
        
        # 1. FFmpeg & FFprobe
        curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
        tar -xf ffmpeg.tar.xz
        EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "ffmpeg-*-amd64-static")
        
        for dir in "${TARGET_LINUX_DIRS[@]}"; do
          cp "$EXTRACTED_DIR/ffmpeg" "$dir/ffmpeg"
          cp "$EXTRACTED_DIR/ffprobe" "$dir/ffprobe"
          chmod +x "$dir/ffmpeg" "$dir/ffprobe"
          echo "Copied FFmpeg and FFprobe to $dir"
        done

        # 2. MediaMTX ללינוקס
        curl -L https://github.com/bluenviron/mediamtx/releases/download/v1.3.0/mediamtx_v1.3.0_linux_amd64.tar.gz -o mediamtx_linux.tar.gz
        tar -xzf mediamtx_linux.tar.gz mediamtx
        cp mediamtx "Tools/Linux/mediamtx"
        cp mediamtx "$SERVER_MTX_DIR/mediamtx"
        cp mediamtx "ITB-SCREEN-RECORDER.Server/Tools/Linux/mediamtx" || true
        chmod +x "Tools/Linux/mediamtx" "$SERVER_MTX_DIR/mediamtx" "ITB-SCREEN-RECORDER.Server/Tools/Linux/mediamtx" || true

    - name: Install Feature Node Dependencies
      run: |
        find Features -name "package.json" -not -path "*/node_modules/*" | while read -r pkg; do
          dir=$(dirname "$pkg")
          echo "Installing dependencies for $dir..."
          (cd "$dir" && (npm ci --prefer-offline --no-audit || npm install))
        done

    - name: Restore NuGet dependencies
      run: dotnet restore ITB-Screen-Recorder.sln

    - name: Run Central Unit Tests (Linux Quality Gate)
      timeout-minutes: 2
      run: |
        dotnet build ITB-SCREEN-RECORDER.Tests/ITB-SCREEN-RECORDER.Tests.csproj --no-restore --configuration Release -p:Version=${{ needs.version.outputs.version }}
        dotnet test ITB-SCREEN-RECORDER.Tests/ITB-SCREEN-RECORDER.Tests.csproj --no-build --configuration Release --verbosity minimal

    - name: Publish Linux Binaries & Installers (.run)
      run: |
        # פריסה ובניית מתקין השרת ללינוקס
        dotnet build Installers/Linux/ITB-SCREEN-RECORDER.Server.Linux.Installer/ITB-SCREEN-RECORDER.Server.Linux.Installer.csproj -c Release -p:Version=${{ needs.version.outputs.version }}
        
        # פריסה ובניית מתקין ה-Agent ללינוקס
        dotnet build Installers/Linux/ITB-SCREEN-RECORDER.Agent.Linux.Installer/ITB-SCREEN-RECORDER.Agent.Linux.Installer.csproj -c Release -p:Version=${{ needs.version.outputs.version }}
        
        # וידוא הרשאות ריצה לחבילות ה-run הנוצרות
        chmod +x Publish/Server/linux/*.run Publish/Agent/linux/*.run || true

    - name: Upload Linux Artifacts (.run packages)
      uses: actions/upload-artifact@v4
      with:
        name: linux-run-artifacts
        path: |
          Publish/Server/linux/*.run
          Publish/Agent/linux/*.run

  github-release:
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-artifacts
        merge-multiple: true

    - name: Create GitHub Release and Upload All Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        name: Release ${{ needs.version.outputs.tag }}
        draft: false
        prerelease: false
        files: |
          all-artifacts/*.msi
          all-artifacts/*.run
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}