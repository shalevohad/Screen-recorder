name: .NET Release & CD

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'גרסה מותאמת אישית (לדוגמה: 2.1.4)'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK (8.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Shutdown .NET Build Server
      run: dotnet build-server shutdown

    - name: Download FFmpeg for AgentWorker (Windows with Retry)
      shell: pwsh
      run: |
        $ffmpegDir = "ITB-SCREEN-RECORDER.AgentWorker"
        New-Item -ItemType Directory -Force -Path $ffmpegDir
        $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
        $zipPath = "ffmpeg.zip"
        
        $maxAttempts = 5
        $attempt = 0
        $success = $false

        while ($attempt -lt $maxAttempts -and -not $success) {
            $attempt++
            Write-Host "Attempt $attempt of $maxAttempts to download FFmpeg..."
            try {
                Invoke-WebRequest -Uri $url -OutFile $zipPath -ErrorAction Stop
                $success = $true
                Write-Host "Download successful!"
            } catch {
                Write-Warning "Download failed: $_"
                if ($attempt -lt $maxAttempts) {
                    Write-Host "Waiting 10 seconds before retrying..."
                    Start-Sleep -Seconds 10
                }
            }
        }

        if (-not $success) {
            throw "Failed to download FFmpeg after $maxAttempts attempts."
        }

        Write-Host "Extracting FFmpeg..."
        Expand-Archive -Path $zipPath -DestinationPath "ffmpeg_extracted" -Force
        $exe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        if ($exe) {
            Copy-Item $exe.FullName -Destination "$ffmpegDir\ffmpeg.exe"
            Write-Host "FFmpeg placed successfully in $ffmpegDir"
        } else {
            throw "Could not find ffmpeg.exe in downloaded archive"
        }

    - name: Restore NuGet dependencies
      run: dotnet restore

    - name: Determine Release Version (SemVer 3-parts)
      id: get_version
      shell: pwsh
      run: |
        $customVer = "${{ github.event.inputs.custom_version }}"
        $refName = "${{ github.ref_name }}"

        if ($customVer -ne "") {
            $version = $customVer.TrimStart('v')
            $tagName = "v$version"
        } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tagName = $refName
            $version = $refName.TrimStart('v')
        } else {
            # שליפת ה-Tag האחרון מ-Git
            $latestTag = git tag -l "v*" --sort=-v:refname | Select-Object -First 1

            if (-not $latestTag) {
                $version = "1.0.1"
            } else {
                $rawVersion = $latestTag.TrimStart('v')
                $parts = [System.Collections.Generic.List[string]]($rawVersion.Split('.'))

                # חיתוך ל-3 ספרות (Major.Minor.Patch)
                if ($parts.Count -gt 3) {
                    $parts = $parts[0..2]
                }
                while ($parts.Count -lt 3) {
                    $parts.Add("0")
                }

                # קידום הספרה השלישית (Patch)
                $parts[2] = ([int]$parts[2] + 1).ToString()
                $version = $parts -join '.'
            }
            $tagName = "v$version"
        }

        Write-Host "Calculated Version: $version"
        Write-Host "Calculated Tag: $tagName"

        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "TAG=$tagName" >> $env:GITHUB_OUTPUT

    - name: Build Solution and Generate MSI Installers (Release)
      run: |
        dotnet build ITB-SCREEN-RECORDER.Core/ITB-SCREEN-RECORDER.Core.csproj --no-restore --configuration Release -p:Version=${{ steps.get_version.outputs.VERSION }}
        dotnet build ITB-SCREEN-RECORDER.Server.Installer/ITB-SCREEN-RECORDER.Server.Installer.wixproj --no-restore --configuration Release -p:Version=${{ steps.get_version.outputs.VERSION }}
        dotnet build ITB-SCREEN-RECORDER.Installer/ITB-SCREEN-RECORDER.Installer.wixproj --no-restore --configuration Release -p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Create GitHub Release and Upload Artifacts
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.TAG }}
        name: Release ${{ steps.get_version.outputs.TAG }}
        draft: false
        prerelease: false
        files: |
          ITB-SCREEN-RECORDER.Installer/bin/x64/Release/*.msi
          ITB-SCREEN-RECORDER.Server.Installer/bin/x64/Release/*.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}