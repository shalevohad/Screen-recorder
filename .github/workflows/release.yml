name: .NET Release & CD

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK (8.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Shutdown .NET Build Server
      run: dotnet build-server shutdown

    - name: Download FFmpeg for AgentWorker (Windows with Retry)
      shell: pwsh
      run: |
        $ffmpegDir = "ITB-SCREEN-RECORDER.AgentWorker"
        New-Item -ItemType Directory -Force -Path $ffmpegDir
        $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
        $zipPath = "ffmpeg.zip"
        
        $maxAttempts = 5
        $attempt = 0
        $success = $false

        while ($attempt -lt $maxAttempts -and -not $success) {
            $attempt++
            Write-Host "Attempt $attempt of $maxAttempts to download FFmpeg..."
            try {
                Invoke-WebRequest -Uri $url -OutFile $zipPath -ErrorAction Stop
                $success = $true
                Write-Host "Download successful!"
            } catch {
                Write-Warning "Download failed: $_"
                if ($attempt -lt $maxAttempts) {
                    Write-Host "Waiting 10 seconds before retrying..."
                    Start-Sleep -Seconds 10
                }
            }
        }

        if (-not $success) {
            throw "Failed to download FFmpeg after $maxAttempts attempts."
        }

        Write-Host "Extracting FFmpeg..."
        Expand-Archive -Path $zipPath -DestinationPath "ffmpeg_extracted" -Force
        $exe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        if ($exe) {
            Copy-Item $exe.FullName -Destination "$ffmpegDir\ffmpeg.exe"
            Write-Host "FFmpeg placed successfully in $ffmpegDir"
        } else {
            throw "Could not find ffmpeg.exe in downloaded archive"
        }

    - name: Restore NuGet dependencies
      run: dotnet restore

    # שלב חדש: חילוץ וניקוי הגרסה מוקם לכאן - לפני הבנייה!
    - name: Extract and Clean Version from Tag
      id: get_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        Write-Host "Original Tag: $tag"
        
        # הסרת האות 'v' בתחילת המחרוזת לקבלת מספר נקי (למשל 1.0.1.17)
        $cleanVersion = $tag -replace '^v', ''
        Write-Host "Cleaned Version for Build: $cleanVersion"
        
        echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        echo "CLEAN_VERSION=$cleanVersion" >> $env:GITHUB_OUTPUT

    # הזרקת הגרסה הנקייה (CLEAN_VERSION) ישירות לתוך הקומפיילר
    - name: Build Solution and Generate MSI Installers (Release)
      run: |
        dotnet build ITB-SCREEN-RECORDER.Core/ITB-SCREEN-RECORDER.Core.csproj --no-restore --configuration Release -p:Version=${{ steps.get_version.outputs.CLEAN_VERSION }}
        dotnet build ITB-SCREEN-RECORDER.Server.Installer/ITB-SCREEN-RECORDER.Server.Installer.wixproj --no-restore --configuration Release -p:Version=${{ steps.get_version.outputs.CLEAN_VERSION }}
        dotnet build ITB-SCREEN-RECORDER.Installer/ITB-SCREEN-RECORDER.Installer.wixproj --no-restore --configuration Release -p:Version=${{ steps.get_version.outputs.CLEAN_VERSION }}

    # יצירת ה-Release תוך שימוש בתג המקורי (עם ה-v)
    - name: Create GitHub Release and Upload Artifacts
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.TAG }}
        name: Release ${{ steps.get_version.outputs.TAG }}
        draft: false
        prerelease: false
        files: |
          ITB-SCREEN-RECORDER.Installer/bin/x64/Release/*.msi
          ITB-SCREEN-RECORDER.Server.Installer/bin/x64/Release/*.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}