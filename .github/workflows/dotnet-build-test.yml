name: .NET Core Cross-Platform CI

on:
  push:
    branches: [ "master", "release" ]
  pull_request:
    branches: [ "master", "release" ]

jobs:
  build-dotnet:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK (8.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './ITB-SCREEN-RECORDER.Server/ClientApp/package-lock.json'

    - name: Shutdown .NET Build Server (Prevent File Locking)
      run: dotnet build-server shutdown

    - name: Download FFmpeg & MediaMTX for Windows (With Retry)
      if: startsWith(matrix.os, 'windows')
      shell: pwsh
      run: |
        $ffmpegDestDirs = @(
            "Tools/Win",
            "ITB-SCREEN-RECORDER.AgentWorker",
            "ITB-SCREEN-RECORDER.AgentWorker/Tools/Win",
            "ITB-SCREEN-RECORDER.Server/Tools/Win",
            "Features/Extractor/ITB-SCREEN-RECORDER.Features.Extractor/Tools/Win",
            "Features/ExtractorAdvanced/ITB-SCREEN-RECORDER.Features.ExtractorAdvanced/Tools/Win",
            "Features/Extractor/Tools/Win",
            "Features/ExtractorAdvanced/Tools/Win"
        )

        foreach ($dir in $ffmpegDestDirs) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
        }
        
        # 1. Download FFmpeg & FFprobe
        $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
        $zipPath = "ffmpeg.zip"
        
        $maxAttempts = 5
        $attempt = 0
        $success = $false

        while ($attempt -lt $maxAttempts -and -not $success) {
            $attempt++
            Write-Host "Attempt $attempt of $maxAttempts to download FFmpeg..."
            try {
                Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipPath -ErrorAction Stop
                $success = $true
            } catch {
                if ($attempt -lt $maxAttempts) { Start-Sleep -Seconds 10 }
            }
        }
        if (-not $success) { throw "Failed to download FFmpeg." }

        Expand-Archive -Path $zipPath -DestinationPath "ffmpeg_extracted" -Force
        $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        $ffprobeExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1

        if (-not $ffmpegExe -or -not $ffprobeExe) {
            throw "FFmpeg or FFprobe executable not found in extracted archive."
        }

        foreach ($dir in $ffmpegDestDirs) {
            Copy-Item $ffmpegExe.FullName -Destination "$dir\ffmpeg.exe" -Force
            Copy-Item $ffprobeExe.FullName -Destination "$dir\ffprobe.exe" -Force
            Write-Host "Copied FFmpeg and FFprobe to $dir"
        }

        # 2. Download MediaMTX for Windows
        Write-Host "Downloading MediaMTX for Windows..."
        $mediamtxUrl = "https://github.com/bluenviron/mediamtx/releases/download/v1.21.0/mediamtx_v1.21.0_windows_amd64.zip"
        $mediamtxZip = "mediamtx_win.zip"
        Invoke-WebRequest -Uri $mediamtxUrl -OutFile $mediamtxZip
        Expand-Archive -Path $mediamtxZip -DestinationPath "mediamtx_win_extracted" -Force

        $mtxExe = Get-ChildItem -Path "mediamtx_win_extracted" -Recurse -Filter "mediamtx.exe" | Select-Object -First 1
        $mtxDestDirs = @(
            "Tools/Win",
            "ITB-SCREEN-RECORDER.Server/MediaMTX",
            "ITB-SCREEN-RECORDER.Server/Tools/Win"
        )
        foreach ($mDir in $mtxDestDirs) {
            New-Item -ItemType Directory -Force -Path $mDir | Out-Null
            Copy-Item $mtxExe.FullName -Destination "$mDir\mediamtx.exe" -Force
            Write-Host "Copied MediaMTX to $mDir"
        }

    - name: Download FFmpeg & MediaMTX for Linux
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        TARGET_LINUX_DIRS=(
          "Tools/Linux"
          "ITB-SCREEN-RECORDER.AgentWorker"
          "ITB-SCREEN-RECORDER.AgentWorker/Tools/Linux"
          "ITB-SCREEN-RECORDER.Server/Tools/Linux"
          "Features/Extractor/ITB-SCREEN-RECORDER.Features.Extractor/Tools/Linux"
          "Features/ExtractorAdvanced/ITB-SCREEN-RECORDER.Features.ExtractorAdvanced/Tools/Linux"
          "Features/Extractor/Tools/Linux"
          "Features/ExtractorAdvanced/Tools/Linux"
        )
        
        for dir in "${TARGET_LINUX_DIRS[@]}"; do
          mkdir -p "$dir"
        done

        # 1. FFmpeg for Linux (pre-installed or via apt)
        echo "Configuring FFmpeg & FFprobe for Linux..."
        if ! which ffmpeg > /dev/null 2>&1 || ! which ffprobe > /dev/null 2>&1; then
          sudo apt-get update && sudo apt-get install -y ffmpeg
        fi

        FFMPEG_BIN=$(which ffmpeg)
        FFPROBE_BIN=$(which ffprobe)

        for dir in "${TARGET_LINUX_DIRS[@]}"; do
          cp "$FFMPEG_BIN" "$dir/ffmpeg"
          cp "$FFPROBE_BIN" "$dir/ffprobe"
          chmod +x "$dir/ffmpeg" "$dir/ffprobe"
          echo "Copied FFmpeg and FFprobe to $dir"
        done

        # 2. Download MediaMTX for Linux
        echo "Downloading MediaMTX for Linux..."
        curl -L https://github.com/bluenviron/mediamtx/releases/download/v1.21.0/mediamtx_v1.21.0_linux_amd64.tar.gz -o mediamtx_linux.tar.gz
        tar -xzf mediamtx_linux.tar.gz mediamtx
        
        MTX_LINUX_DIRS=(
          "Tools/Linux"
          "ITB-SCREEN-RECORDER.Server/MediaMTX"
          "ITB-SCREEN-RECORDER.Server/Tools/Linux"
        )
        for mdir in "${MTX_LINUX_DIRS[@]}"; do
          mkdir -p "$mdir"
          cp mediamtx "$mdir/mediamtx"
          chmod +x "$mdir/mediamtx"
          echo "Copied MediaMTX to $mdir"
        done

        echo "FFmpeg, FFprobe and MediaMTX placed successfully for Linux."

    - name: Restore NuGet dependencies
      run: dotnet restore ITB-Screen-Recorder.sln

    - name: Build Solution (Release Configuration - Windows)
      if: startsWith(matrix.os, 'windows')
      run: |
        dotnet build ITB-SCREEN-RECORDER.Core/ITB-SCREEN-RECORDER.Core.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.AgentWorker/ITB-SCREEN-RECORDER.AgentWorker.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.AgentService/ITB-SCREEN-RECORDER.AgentService.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.Server/ITB-SCREEN-RECORDER.Server.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.Tests/ITB-SCREEN-RECORDER.Tests.csproj --no-restore --configuration Release
        dotnet restore Installers/Windows/ITB-SCREEN-RECORDER.Server.Installer/ITB-SCREEN-RECORDER.Server.Installer.wixproj
        dotnet build Installers/Windows/ITB-SCREEN-RECORDER.Server.Installer/ITB-SCREEN-RECORDER.Server.Installer.wixproj --configuration Release
        dotnet restore Installers/Windows/ITB-SCREEN-RECORDER.Installer/ITB-SCREEN-RECORDER.Installer.wixproj
        dotnet build Installers/Windows/ITB-SCREEN-RECORDER.Installer/ITB-SCREEN-RECORDER.Installer.wixproj --configuration Release

    - name: Build Solution (Release Configuration - Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        dotnet build ITB-SCREEN-RECORDER.Core/ITB-SCREEN-RECORDER.Core.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.AgentWorker/ITB-SCREEN-RECORDER.AgentWorker.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.AgentService/ITB-SCREEN-RECORDER.AgentService.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.Server/ITB-SCREEN-RECORDER.Server.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.Tests/ITB-SCREEN-RECORDER.Tests.csproj --no-restore --configuration Release

    - name: Run Central Unit Tests
      timeout-minutes: 10
      run: dotnet test ITB-SCREEN-RECORDER.Tests/ITB-SCREEN-RECORDER.Tests.csproj --no-build --configuration Release --verbosity minimal