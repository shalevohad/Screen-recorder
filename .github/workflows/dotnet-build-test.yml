name: .NET Core Cross-Platform CI

on:
  push:
    branches: [ "master", "release" ]
  pull_request:
    branches: [ "master", "release" ]

jobs:
  build-dotnet:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK (8.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Shutdown .NET Build Server (Prevent File Locking)
      run: dotnet build-server shutdown

    - name: Download FFmpeg & FFprobe for Windows (With Retry)
      if: startsWith(matrix.os, 'windows')
      shell: pwsh
      run: |
        $toolsDir = "Tools/Windows"
        New-Item -ItemType Directory -Force -Path $toolsDir
        $agentDir = "ITB-SCREEN-RECORDER.AgentWorker"
        New-Item -ItemType Directory -Force -Path $agentDir
        
        $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
        $zipPath = "ffmpeg.zip"
        
        $maxAttempts = 5
        $attempt = 0
        $success = $false

        while ($attempt -lt $maxAttempts -and -not $success) {
            $attempt++
            Write-Host "Attempt $attempt of $maxAttempts to download FFmpeg/FFprobe..."
            try {
                Invoke-WebRequest -Uri $url -OutFile $zipPath -ErrorAction Stop
                $success = $true
                Write-Host "Download successful!"
            } catch {
                Write-Warning "Download failed: $_"
                if ($attempt -lt $maxAttempts) {
                    Write-Host "Waiting 10 seconds before retrying..."
                    Start-Sleep -Seconds 10
                }
            }
        }

        if (-not $success) {
            throw "Failed to download FFmpeg after $maxAttempts attempts."
        }

        Write-Host "Extracting FFmpeg & FFprobe..."
        Expand-Archive -Path $zipPath -DestinationPath "ffmpeg_extracted" -Force
        
        $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        $ffprobeExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1

        if ($ffmpegExe) {
            Copy-Item $ffmpegExe.FullName -Destination "$toolsDir\ffmpeg.exe"
            Copy-Item $ffmpegExe.FullName -Destination "$agentDir\ffmpeg.exe"
        } else {
            throw "Could not find ffmpeg.exe in downloaded archive"
        }

        if ($ffprobeExe) {
            Copy-Item $ffprobeExe.FullName -Destination "$toolsDir\ffprobe.exe"
            Copy-Item $ffprobeExe.FullName -Destination "$agentDir\ffprobe.exe"
        } else {
            throw "Could not find ffprobe.exe in downloaded archive"
        }

    - name: Download FFmpeg & FFprobe for Linux
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        TOOLS_DIR="Tools/Linux"
        AGENT_DIR="ITB-SCREEN-RECORDER.AgentWorker"
        mkdir -p "$TOOLS_DIR"
        mkdir -p "$AGENT_DIR"
        
        echo "Downloading FFmpeg static build for Linux..."
        curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
        tar -xf ffmpeg.tar.xz
        EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "ffmpeg-*-amd64-static")
        
        cp "$EXTRACTED_DIR/ffmpeg" "$TOOLS_DIR/ffmpeg"
        cp "$EXTRACTED_DIR/ffprobe" "$TOOLS_DIR/ffprobe"
        chmod +x "$TOOLS_DIR/ffmpeg" "$TOOLS_DIR/ffprobe"
        
        cp "$EXTRACTED_DIR/ffmpeg" "$AGENT_DIR/ffmpeg"
        cp "$EXTRACTED_DIR/ffprobe" "$AGENT_DIR/ffprobe"
        chmod +x "$AGENT_DIR/ffmpeg" "$AGENT_DIR/ffprobe"
        
        echo "FFmpeg and FFprobe placed successfully for Linux."

    - name: Restore NuGet dependencies
      run: dotnet restore

    - name: Build Solution (Release Configuration - Windows)
      if: startsWith(matrix.os, 'windows')
      run: |
        dotnet build ITB-SCREEN-RECORDER.Core/ITB-SCREEN-RECORDER.Core.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.AgentWorker/ITB-SCREEN-RECORDER.AgentWorker.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.AgentService/ITB-SCREEN-RECORDER.AgentService.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.Server/ITB-SCREEN-RECORDER.Server.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.Server.Installer/ITB-SCREEN-RECORDER.Server.Installer.wixproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.Installer/ITB-SCREEN-RECORDER.Installer.wixproj --no-restore --configuration Release

    - name: Build Solution (Release Configuration - Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        dotnet build ITB-SCREEN-RECORDER.Core/ITB-SCREEN-RECORDER.Core.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.AgentWorker/ITB-SCREEN-RECORDER.AgentWorker.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.AgentService/ITB-SCREEN-RECORDER.AgentService.csproj --no-restore --configuration Release
        dotnet build ITB-SCREEN-RECORDER.Server/ITB-SCREEN-RECORDER.Server.csproj --no-restore --configuration Release

    - name: Run .NET Automated Tests
      run: dotnet test --no-build --configuration Release --verbosity normal