name: Dependency & Code Security Architecture Scan

on:
  push:
    branches: [ "master", "release" ]
  pull_request:
    branches: [ "master", "release" ]
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # נדרש להיסטוריה מלאה של commits עבור TruffleHog

    # ─── שכבה 1: סריקת דליפת סודות ומפתחות (AI Leaks Defense) ─────────────
    - name: Secret Leak Detection (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --only-verified

    # ─── שכבה 2: ניתוח קוד סטטי (SAST) עם Semgrep עבור C# ו-JS/TS ────────
    - name: Static Code Analysis (Semgrep)
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/csharp
          p/typescript
          p/react
          p/security-audit
          p/owasp-top-ten
      env:
        SEMGREP_RULES: p/ci

    # ─── שכבה 3: בדיקת תלויות עוינות והזיות חבילות (Socket Security) ──────
    - name: Scan NPM Dependencies with Socket.dev
      uses: socketsecurity/socket-action@v1
      continue-on-error: true # מומלץ להפעיל במצב אזהרה תחילה עד הגדרת הטוקן
      with:
        api_key: ${{ secrets.SOCKET_SECURITY_API_KEY }}

    # ─── שכבה 4: סריקת פגיעויות ב-NuGet (.NET) ───────────────────────────
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: dotnet restore ITB-Screen-Recorder.sln

    - name: Scan .NET packages for known vulnerabilities
      run: |
        OUTPUT=$(dotnet list ITB-Screen-Recorder.sln package --vulnerable 2>&1 || true)
        echo "$OUTPUT"
        if echo "$OUTPUT" | grep -q "has the following vulnerable"; then
          echo "::error::Vulnerable NuGet packages detected. Review the output above."
          exit 1
        fi

    # ─── שכבה 5: סריקת NPM Audit קיימת ──────────────────────────────────
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Scan all NPM projects for vulnerabilities
      run: |
        PROJECTS=(
          "./ITB-SCREEN-RECORDER.Server/ClientApp"
          "./Features/Extractor/ITB-SCREEN-RECORDER.Features.Extractor/Client"
          "./Features/ExtractorAdvanced/ITB-SCREEN-RECORDER.Features.ExtractorAdvanced/Client"
        )

        for dir in "${PROJECTS[@]}"; do
          if [ -d "$dir" ]; then
            echo "=================================================="
            echo "Processing NPM project in: $dir"
            echo "=================================================="

            cd "$dir"

            echo "-> Installing dependencies without lifecycle scripts..."
            # --ignore-scripts חוסם הרצת סקריפטים זדוניים בשלב ה-install
            npm ci --include=optional --ignore-scripts

            echo "-> Running security audit (high + critical only)..."
            npm audit --audit-level=high || echo "::warning::Audit issues found in $dir"

            cd - > /dev/null
            echo ""
          else
            echo "::warning:: Directory $dir not found, skipping."
          fi
        done
