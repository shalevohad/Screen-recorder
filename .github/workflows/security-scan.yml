name: Dependency Security Architecture Scan

on:
  push:
    branches: [ "master", "release" ]
  pull_request:
    branches: [ "master", "release" ]
  schedule:
    # הרצה אוטומטית בכל יום ראשון ב-00:00 בלילה (שעון UTC)
    - cron: '0 0 * * 0'

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- סריקת חולשות עבור ה-Backend (.NET) ---
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: dotnet restore ITB-SCREEN-RECORDER.sln

    - name: Scan .NET packages for known vulnerabilities
      run: dotnet list ITB-SCREEN-RECORDER.sln package --vulnerable

# --- סריקת חולשות עבור כלל סביבות ה-Frontend (NPM) ---
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Scan all NPM projects for vulnerabilities
      run: |
        # רשימת התיקיות שבהן יש קובצי package.json / package-lock.json
        PROJECTS=(
          "./ITB-SCREEN-RECORDER.Server/ClientApp"
          "./Features/Extractor/ITB-SCREEN-RECORDER.Features.Extractor/Client"
          "./Features/ExtractorAdvanced/ITB-SCREEN-RECORDER.Features.ExtractorAdvanced/Client"
        )
        
        for dir in "${PROJECTS[@]}"; do
          if [ -d "$dir" ]; then
            echo "=================================================="
            echo "Processing NPM project in: $dir"
            echo "=================================================="
            
            cd "$dir"
            
            echo "-> Installing dependencies..."
            npm ci --include=optional
            
            echo "-> Running security audit..."
            npm audit --audit-level=high
            
            # חזרה חזרה לתיקיית השורש של הריפו
            cd - > /dev/null
            echo ""
          else
            echo "::warning:: Directory $dir not found, skipping."
          fi
        done