name: Dependency Security Architecture Scan

on:
  push:
    branches: [ "master", "release" ]
  pull_request:
    branches: [ "master", "release" ]
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ─── .NET NuGet Vulnerability Scan ───────────────────────────────────────
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: dotnet restore ITB-Screen-Recorder.sln

    - name: Scan .NET packages for known vulnerabilities
      run: |
        OUTPUT=$(dotnet list ITB-Screen-Recorder.sln package --vulnerable 2>&1 || true)
        echo "$OUTPUT"
        # Exit non-zero only when an actual vulnerability is reported.
        # WiX projects on Linux skip restore and emit 'No assets file was found',
        # exiting 1. We check specifically for actual vulnerability reports.
        if echo "$OUTPUT" | grep -q "has the following vulnerable"; then
          echo "::error::Vulnerable NuGet packages detected. Review the output above."
          exit 1
        fi

    # ─── NPM Vulnerability Scan ──────────────────────────────────────────────
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Scan all NPM projects for vulnerabilities
      run: |
        # Directories containing package.json / package-lock.json
        PROJECTS=(
          "./ITB-SCREEN-RECORDER.Server/ClientApp"
          "./Features/Extractor/ITB-SCREEN-RECORDER.Features.Extractor/Client"
          "./Features/ExtractorAdvanced/ITB-SCREEN-RECORDER.Features.ExtractorAdvanced/Client"
        )

        for dir in "${PROJECTS[@]}"; do
          if [ -d "$dir" ]; then
            echo "=================================================="
            echo "Processing NPM project in: $dir"
            echo "=================================================="

            cd "$dir"

            echo "-> Installing dependencies..."
            npm ci --include=optional

            echo "-> Running security audit (high + critical only)..."
            npm audit --audit-level=high || echo "::warning::Audit issues found in $dir"

            # Return to repository root
            cd - > /dev/null
            echo ""
          else
            echo "::warning:: Directory $dir not found, skipping."
          fi
        done