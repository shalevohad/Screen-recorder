name: Dependency Security Architecture Scan

on:
  push:
    branches: [ "master", "release" ]
  pull_request:
    branches: [ "master", "release" ]
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ─── .NET NuGet Vulnerability Scan ───────────────────────────────────────
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: dotnet restore ITB-Screen-Recorder.sln

    - name: Scan .NET packages for known vulnerabilities (direct + transitive)
      run: |
        OUTPUT=$(dotnet list ITB-Screen-Recorder.sln package --vulnerable --include-transitive 2>&1)
        echo "$OUTPUT"
        # Exit non-zero only when an actual vulnerability is reported.
        # The command exits 1 on "no assets file" errors as well as on real CVEs;
        # we distinguish them by checking for the CVE advisory keyword.
        if echo "$OUTPUT" | grep -qi "critical\|high\|moderate\|low"; then
          echo "::error::Vulnerable NuGet packages detected. Review the output above."
          exit 1
        fi

    # ─── NPM Vulnerability Scan ──────────────────────────────────────────────
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Scan all NPM projects for vulnerabilities
      run: |
        # Directories containing package.json / package-lock.json
        PROJECTS=(
          "./ITB-SCREEN-RECORDER.Server/ClientApp"
          "./Features/Extractor/ITB-SCREEN-RECORDER.Features.Extractor/Client"
          "./Features/ExtractorAdvanced/ITB-SCREEN-RECORDER.Features.ExtractorAdvanced/Client"
        )

        FAILED=0
        for dir in "${PROJECTS[@]}"; do
          if [ -d "$dir" ]; then
            echo "=================================================="
            echo "Processing NPM project in: $dir"
            echo "=================================================="

            cd "$dir"

            echo "-> Installing dependencies..."
            npm ci --include=optional

            echo "-> Running security audit (high + critical only)..."
            if ! npm audit --audit-level=high; then
              echo "::error::High/Critical NPM vulnerabilities found in $dir"
              FAILED=1
            fi

            # Return to repository root
            cd - > /dev/null
            echo ""
          else
            echo "::warning:: Directory $dir not found, skipping."
          fi
        done

        exit $FAILED